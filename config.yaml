model_list:
  # Local Gemma 4 31B served by TabbyAPI/ExLlamaV2.
  # The upstream model name after "openai/" should match TabbyAPI's /v1/models id.
  # - model_name: gemma-4-31b
  #   litellm_params:
  #     model: openai/gemma-4-31b
  #     api_base: http://127.0.0.1:5000/v1
  #     api_key: tabby-local
  #     extra_headers:
  #       x-api-key: tabby-local
  # GCP Agent Platform (Vertex AI). Credential path is relative to the
  # service working directory (repository root on systemd, /app in Docker).
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: vertex_ai/gemini-3.5-flash-lite
      vertex_project: changdar-ai
      vertex_location: global
      vertex_credentials: secrets/changdar-ai-llm-server.json
  - model_name: gemini-3.8-flash
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: changdar-ai
      vertex_location: global
      vertex_credentials: secrets/changdar-ai-llm-server.json
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: changdar-ai
      vertex_location: global
      vertex_credentials: secrets/changdar-ai-llm-server.json

  # Claude requests currently return HTTP 429 for the project's global
  # anthropic-claude-sonnet / anthropic-claude-opus request quotas (2026-09-21).
  # These routes require available quota before they can serve conversations.
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: changdar-ai
      vertex_location: global
      vertex_credentials: secrets/changdar-ai-llm-server.json
  - model_name: claude-opus-5
    litellm_params:
      model: vertex_ai/claude-opus-5
      vertex_project: changdar-ai
      vertex_location: global
      vertex_credentials: secrets/changdar-ai-llm-server.json

  # - model_name: qwen3.5-27b
  #   litellm_params:
  #     model: openai/Qwen3.5-27B-exl3-3.0bpw
  #     api_base: http://127.0.0.1:5001/v1
  #     api_key: tabby-local

  # Local Qwen/Tabby and Ollama models are intentionally disabled while the
  # RTX 4090 is dedicated to PaddleOCR-VL. Their container/configuration stay
  # in place for a future manual rollback; Open WebUI should use cloud models
  # below through LiteLLM in the meantime.
  # - model_name: qwen3.5-35b-a3b
  #   litellm_params:
  #     model: openai/Qwen3.5-35B-A3B-exl3-4.09bpw
  #     api_base: http://127.0.0.1:5001/v1
  #     api_key: tabby-local
  # - model_name: gpt-oss-20b
  #   litellm_params:
  #     model: ollama_chat/gpt-oss:20b
  #     api_base: http://127.0.0.1:11434
  #   model_info:
  #     mode: chat

  # Azure AI Foundry deployments.  The resource base URL deliberately omits
  # /openai/v1: LiteLLM adds that path for the Azure v1 API.  The static
  # deployment key is kept only in .env.litellm (never in this file).
  - model_name: Kimi-K2.5
    litellm_params:
      model: azure/Kimi-K2.5
      api_base: https://changdar-ai-dev-3-resource.services.ai.azure.com
      api_version: "v1"
      azure_scope: https://ai.azure.com/.default
      api_key: os.environ/AZURE_AI_API_KEY
      # Required: LiteLLM 1.102.0 Azure routing records zero cost without these rates.
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.000003
      cache_read_input_token_cost: 0.0000001
    model_info:
      base_model: azure_ai/kimi-k2.5

  - model_name: Kimi-K2.6
    litellm_params:
      model: azure/Kimi-K2.6
      api_base: https://changdar-ai-dev-3-resource.services.ai.azure.com
      api_version: "v1"
      azure_scope: https://ai.azure.com/.default
      api_key: os.environ/AZURE_AI_API_KEY
      # Required: LiteLLM 1.102.0 Azure routing records zero cost without these rates.
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000016
    model_info:
      base_model: azure_ai/kimi-k2.6

  # Azure AI Foundry deployment. The model/deployment name must remain the
  # exact lower-case value configured in the Foundry project.
  - model_name: grok-4.6
    litellm_params:
      model: azure/grok-4.6
      api_base: https://changdar-ai-dev-3-resource.services.ai.azure.com
      api_version: "v1"
      azure_scope: https://ai.azure.com/.default
      api_key: os.environ/AZURE_AI_API_KEY
      # Required: LiteLLM 1.102.0 Azure routing records zero cost without these rates.
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      cache_read_input_token_cost: 0.0000005
    model_info:
      base_model: azure_ai/grok-4.6

  # Azure AI Foundry DeepSeek deployments. Keep both model names exactly
  # aligned with their deployment names in the Foundry project.
  - model_name: DeepSeek-V4-Flash
    litellm_params:
      model: azure/DeepSeek-V4-Flash
      api_base: https://changdar-ai-dev-3-resource.services.ai.azure.com
      api_version: "v1"
      azure_scope: https://ai.azure.com/.default
      api_key: os.environ/AZURE_AI_API_KEY
      # Required: LiteLLM 1.102.0 Azure routing records zero cost without these rates.
      input_cost_per_token: 0.00000019
      output_cost_per_token: 0.00000051
      cache_read_input_token_cost: 0.000000028
    model_info:
      base_model: azure_ai/deepseek-v4-flash

  - model_name: DeepSeek-V4-Pro
    litellm_params:
      model: azure/DeepSeek-V4-Pro
      api_base: https://changdar-ai-dev-3-resource.services.ai.azure.com
      api_version: "v1"
      azure_scope: https://ai.azure.com/.default
      api_key: os.environ/AZURE_AI_API_KEY
      # Required: LiteLLM 1.102.0 Azure routing records zero cost without these rates.
      input_cost_per_token: 0.00000174
      output_cost_per_token: 0.00000348
      cache_read_input_token_cost: 0.000000145
    model_info:
      base_model: azure_ai/deepseek-v4-pro

# Azure Foundry can briefly throttle this serverless deployment.  Keep the
# requested model when possible, then fail over to the separately deployed
# Kimi-K2.5 rather than returning an HTTP 429 to Open WebUI.
router_settings:
  # Apply the shorter retry policy only to K2.6. Other model groups retain
  # LiteLLM's normal retry behaviour.
  retry_after: 8
  model_group_retry_policy:
    Kimi-K2.6:
      RateLimitErrorRetries: 1
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 1
  cooldown_time: 30
  max_fallbacks: 1
  fallbacks:
    - Kimi-K2.6:
        - Kimi-K2.5

# LiteLLM persists virtual keys, per-user budgets, and spend records in its own
# database. `max_end_user_budget_id` enforces the daily USD limit set below.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

litellm_settings:
  timezone: Asia/Taipei
  max_end_user_budget_id: openwebui-daily-usd-4

