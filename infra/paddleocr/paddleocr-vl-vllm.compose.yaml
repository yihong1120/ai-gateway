# Official PaddleOCR-VL service topology, adapted only to keep the public
# surface loopback-only and to allow a zero-config-change staging port.
# Source topology:
# https://github.com/PaddlePaddle/PaddleOCR/tree/main/deploy/paddleocr_vl_docker/accelerators/nvidia-gpu
#
# Production usage:
#   docker compose -f infra/paddleocr/paddleocr-vl-vllm.compose.yaml up -d
#
# To stage a future image before replacing this service, set
# PADDLEOCR_VL_HOST_PORT=8114 for that separate Compose project. Open WebUI
# retains its existing http://127.0.0.1:8113/layout-parsing endpoint unchanged.

services:
  paddleocr-vl-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:paddleocr3.4-nvidia-gpu
    ports:
      - "127.0.0.1:${PADDLEOCR_VL_HOST_PORT:-8113}:8080"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    restart: unless-stopped
    environment:
      VLM_BACKEND: vllm
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_vllm.yaml"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:paddleocr3.4-nvidia-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    shm_size: 64g
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      start_period: 300s
