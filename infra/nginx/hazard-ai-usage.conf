# Add this location inside the existing HTTPS `server { ... }` block in
# /etc/nginx/sites-available/default, near the other /hazard/api/ locations.
#
# Public path:
#   /hazard/api/ai_usage/v1/me/usage/daily
#
# It deliberately goes through the Visionnaire BFF first.  The BFF validates
# the browser session and forwards its server-side Keycloak access token to
# the loopback-only ai_usage service.  Do not proxy this public path directly
# to port 8012 and do not forward a browser Authorization header.
location ^~ /hazard/api/ai_usage/ {
    proxy_pass http://127.0.0.1:8005/bff/ai_usage/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_http_version 1.1;
    proxy_buffering off;
}
