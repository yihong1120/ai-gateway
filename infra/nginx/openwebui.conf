# Deprecated compatibility redirect for the main HTTPS server block.
#
# Open WebUI 0.8.1 does not support a URL path prefix, so do not proxy or
# sub_filter /openwebui/. Its supported public root is served by the separate
# dedicated `ai.changdar-server.mooo.com` vhost.
location = /openwebui {
    return 308 https://ai.changdar-server.mooo.com/;
}

location ^~ /openwebui/ {
    return 308 https://ai.changdar-server.mooo.com/;
}
