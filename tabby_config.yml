network:
  host: 0.0.0.0
  port: 5001
  disable_auth: true
  api_servers: ["OAI"]

model:
  model_dir: models
  model_name: Qwen3.5-35B-A3B-exl3-4.09bpw
  backend: exllamav3
  # Qwen3.5 natively supports 262,144 tokens.  40,960 preserves substantial
  # conversation history while reserving GPU headroom for local document OCR.
  max_seq_len: 40960
  cache_size: 40960
  cache_mode: 4,4
  prompt_template:
  vision: false
  max_batch_size: 1
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: auto
  tool_calls_in_reasoning: true
  tool_format: qwen3_5

