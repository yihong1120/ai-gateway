repos:
-   repo: local
    hooks:
    -   id: dependency-lock
        name: dependency lock matches pyproject
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
    -   id: candidate-settings
        name: candidate settings match presets
        entry: python -m company_agent.configs.build --check
        language: system
        pass_filenames: false
        files: ^company_agent/configs/
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: double-quote-string-fixer
    -   id: name-tests-test
        args: [--pytest-test-first]
        files: (^|/)test_[^/]+\.py$
-   repo: https://github.com/asottile/reorder-python-imports
    rev: v3.17.0
    hooks:
    -   id: reorder-python-imports
        args: [--py311-plus, --add-import, 'from __future__ import annotations']
-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py311-plus]
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
        args: [--in-place, --exit-code, --max-line-length=120]
-   repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
    -   id: flake8
        # Prompts and external contracts contain long strings that must stay intact.
        args: [--max-line-length=120, --extend-ignore=E501]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
        # Framework adapters and dynamic test stubs do not yet have a typing baseline.
        files: ^examples/(identity|bff|db_management|deployment/registry|ai_usage)/.*\.py$
        additional_dependencies: [types-pyyaml]
    -   id: mypy
        name: mypy (full repository audit)
        stages: [manual]
        additional_dependencies: [types-pyyaml]
