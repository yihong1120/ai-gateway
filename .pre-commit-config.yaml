repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: double-quote-string-fixer
    -   id: name-tests-test
        args: [--pytest-test-first]
        files: (^|/)test_[^/]+\.py$
    -   id: requirements-txt-fixer
-   repo: https://github.com/asottile/setup-cfg-fmt
    rev: v3.2.0
    hooks:
    -   id: setup-cfg-fmt
-   repo: https://github.com/asottile/reorder-python-imports
    rev: v3.17.0
    hooks:
    -   id: reorder-python-imports
        exclude: ^pre_commit/resources/
        args: [--py310-plus, --add-import, 'from __future__ import annotations']
-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py310-plus]
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
        args: [--in-place, --exit-code, --max-line-length=120]
-   repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
    -   id: flake8
        # Prompts and external contracts contain long strings that must stay intact.
        args: [--max-line-length=120, --extend-ignore=E501]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
        # Framework adapters and dynamic test stubs do not yet have a typing baseline.
        files: ^examples/(auth|bff|db_management|deployment_registry|ai_usage)/.*\.py$
        additional_dependencies: [types-pyyaml]
    -   id: mypy
        name: mypy (full repository audit)
        stages: [manual]
        additional_dependencies: [types-pyyaml]
        exclude: ^testing/resources/
