name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: |
          python -m pip install uv==0.9.9
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server
          npm install -g @openai/codex@0.164.0
      - name: Install locked project dependencies
        run: uv sync --frozen --all-extras
      - name: Run offline validation
        run: uv run --frozen --all-extras python -m examples.deployment.tools.validate --output /tmp/ai-gateway-validation
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: /tmp/ai-gateway-validation
          retention-days: 7
