# Native vLLM configuration for the PaddleOCR-VL-1.6 backend.
# Copy to a private ocr-vllm.local.yaml; Docker mounts the selected model here.
model: /models/model
served-model-name: PaddleOCR-VL-1.6-0.9B
trust-remote-code: true
trust-request-mm-kwargs: true
dtype: bfloat16
max-model-len: 8192
max-num-seqs: 1
max-num-batched-tokens: 4096
gpu-memory-utilization: 0.20
# One active sequence needs less than the automatic multi-GiB cache estimate
# on the GPU shared with the text model and PaddleX.
kv-cache-memory-bytes: 536870912
enable-prefix-caching: false
mm-processor-cache-gb: 0
enforce-eager: true
host: 0.0.0.0
port: 8000
